name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  # ============================================================================
  # FRONTEND: Lint, Type Check, Build
  # ============================================================================
  frontend-ci:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter (oxlint)
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Type check (TypeScript)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: https://api.example.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ matrix.node-version }}
          path: frontend/dist
          retention-days: 7

  # ============================================================================
  # BACKEND: Lint, Type Check, Unit Tests
  # ============================================================================
  backend-ci:
    name: Backend - Test & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    services:
      # Optional: PostgreSQL for integration tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: coldsense
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: coldsense_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black isort mypy

      - name: Lint with flake8
        working-directory: backend
        run: |
          # Stop build on errors (E = errors)
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings don't stop build
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        continue-on-error: true

      - name: Code formatting check (black)
        working-directory: backend
        run: black --check app
        continue-on-error: true

      - name: Import sorting check (isort)
        working-directory: backend
        run: isort --check-only app
        continue-on-error: true

      - name: Type checking (mypy)
        working-directory: backend
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests with pytest
        working-directory: backend
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
        env:
          DATABASE_URL: postgresql://coldsense:testpass@localhost:5432/coldsense_test
          MQTT_BROKER: localhost
          MQTT_PORT: 1883
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

  # ============================================================================
  # SECURITY: Dependency scanning, Secret scanning
  # ============================================================================
  security-scan:
    name: Security - Dependency & Secret Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Secret scanning with GitGuardian
        uses: GitGuardian/ggshield-action@master
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true

  # ============================================================================
  # STATUS CHECK: Ensure all jobs passed
  # ============================================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, security-scan]
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.frontend-ci.result }}" != "success" || "${{ needs.backend-ci.result }}" != "success" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          fi
          echo "✅ CI pipeline passed"
