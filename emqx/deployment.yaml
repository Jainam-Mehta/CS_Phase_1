apiVersion: apps/v1
kind: Deployment

metadata:
  name: emqx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: emqx

  template:
    metadata:
      labels:
        app: emqx

    spec:
      containers:
      - name: emqx
        image: emqx/emqx:latest

        ports:
        - containerPort: 1883

        - containerPort: 18083