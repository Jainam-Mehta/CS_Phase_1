<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00E5FF" />
      <stop offset="50%" stopColor="#1E90FF" />
      <stop offset="100%" stopColor="#0052D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stopColor="#1E90FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark tech rounded container -->
  <rect width="64" height="64" rx="14" fill="#0B132B" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#glowGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Isometric cold grid dots -->
  <circle cx="16" cy="16" r="1.5" fill="#1E90FF" opacity="0.3" />
  <circle cx="48" cy="16" r="1.5" fill="#1E90FF" opacity="0.3" />
  <circle cx="16" cy="48" r="1.5" fill="#1E90FF" opacity="0.3" />
  <circle cx="48" cy="48" r="1.5" fill="#1E90FF" opacity="0.3" />

  <!-- Modern Tech S Emblem -->
  <g filter="url(#neon)">
    <!-- Upper arc of S -->
    <path d="M44 20 C44 14 38 12 32 12 C24 12 20 16 20 22 C20 30 32 30 32 34 C32 38 28 40 22 40 C16 40 14 36 14 34" 
          stroke="url(#sysGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Lower arc of S -->
    <path d="M20 44 C20 50 26 52 32 52 C40 52 44 48 44 42 C44 34 32 34 32 30 C32 26 36 24 42 24" 
          stroke="url(#sysGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Cold Chain Frost & Sensor Data Nodes -->
  <circle cx="44" cy="20" r="3" fill="#00E5FF" />
  <circle cx="44" cy="20" r="1.2" fill="#FFFFFF" />
  <circle cx="20" cy="44" r="3" fill="#00E5FF" />
  <circle cx="20" cy="44" r="1.2" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="2.5" fill="#FFA500" />
</svg>