apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: coldsense
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    log_type all

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: coldsense
  labels:
    app: mosquitto
    tier: mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
        tier: mqtt
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2
        ports:
        - name: mqtt
          containerPort: 1883
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
        - name: data
          mountPath: /mosquitto/data
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: mosquitto-config
      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: coldsense
  labels:
    app: mosquitto
spec:
  type: ClusterIP  # Internal service, not exposed externally
  selector:
    app: mosquitto
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
    protocol: TCP
