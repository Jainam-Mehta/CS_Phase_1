apiVersion: apps/v1
kind: Deployment
metadata:
  name: coldsense-backend
  namespace: coldsense
  labels:
    app: coldsense-backend
    version: v1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coldsense-backend
  template:
    metadata:
      labels:
        app: coldsense-backend
        version: v1.0
    spec:
      serviceAccountName: default
      containers:
      - name: backend
        image: asia-south1-docker.pkg.dev/exalted-skein-505210-g0/coldsense-repo/backend:v1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # Database connection via Cloud SQL Proxy
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: database-url
        
        # Supabase Auth (keep for login/signup)
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: supabase-url
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: supabase-key
        - name: SUPABASE_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: supabase-service-key
        
        # MQTT Configuration
        - name: MQTT_BROKER
          valueFrom:
            secretKeyRef:
              name: mqtt-credentials
              key: mqtt-broker
        - name: MQTT_PORT
          valueFrom:
            secretKeyRef:
              name: mqtt-credentials
              key: mqtt-port
        
        # Application settings
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
      
      restartPolicy: Always
