apiVersion: apps/v1
kind: Deployment
metadata:
  name: coldsense-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coldsense-test
  template:
    metadata:
      labels:
        app: coldsense-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80